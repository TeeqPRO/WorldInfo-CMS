<div class="account-shell">
  <header class="account-topbar">
    <a class="account-brand" routerLink="/">
      <span class="brand-dot"></span>
      WorldInfo
      <span class="brand-tag">PL</span>
    </a>
    <nav class="account-nav" aria-label="Konto">
      <a routerLink="/register">Rejestracja</a>
    </nav>
  </header>

  <main class="account-layout">
    <section class="account-copy">
      <span class="eyebrow">Konto WorldInfo</span>
      <h1>Logowanie</h1>
      <p>Panel konta, profil i uprawnienia redakcyjne w jednym miejscu.</p>
    </section>

    <form class="auth-panel" (ngSubmit)="login()">
      <div class="auth-panel-heading">
        <span class="section-kicker">Dostep</span>
        <h2>Zaloguj sie</h2>
      </div>

      <label class="form-group">
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="admin@test.pl"
          required
        />
      </label>

      <label class="form-group">
        Haslo
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />
      </label>

      <div class="form-error" *ngIf="error()">{{ error() }}</div>

      <button class="cta auth-submit" type="submit" [disabled]="isBusy() || !email || !password">
        {{ isBusy() ? 'Logowanie...' : 'Zaloguj' }}
      </button>

      <p class="form-switch">
        Nie masz konta?
        <a routerLink="/register">Utworz konto</a>
      </p>
    </form>
  </main>
</div>
